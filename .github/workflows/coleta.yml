name: Coleta de Precos PIX (07h e 19h)
​on:
schedule:
# 10:00 UTC = 07:00 BRT (UTC-3)
- cron: '0 10 * * *'
# 22:00 UTC = 19:00 BRT (UTC-3)
- cron: '0 22 * * *'
workflow_dispatch:
​jobs:
coletar_precos_pix:
runs-on: ubuntu-latest
permissions:
contents: write
steps:
- name: Baixar repositorio
uses: actions/checkout@v4
​- name: Configurar Python 3.11
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: Instalar Playwright e Chromium
run: |
pip install playwright
playwright install chromium
​- name: Executar coleta PIX (07h/19h)
run: python scraper_precos_pix.py
​- name: Publicar precos_pix.json atualizado
run: |
git config user.name "PriceTracker PIX Bot"
git config user.email "bot@users.noreply.github.com"
git add precos_pix.json
git commit -m "Atualiza precos_pix.json (turno 07h/19h)" || exit 0
git push
